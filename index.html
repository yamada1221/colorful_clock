<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背景色変化時計</title>
<style>
	body {
		margin: 0;
		display: flex;
		justify-content: center;
		align-items: center;
		height: 100vh;
		height: 100dvh;
		color: #fff;
		font-family: Arial, sans-serif;
		position: relative;
		isolation: isolate;
		background-color: #243447;
		overflow: hidden;
	}

	#display {
		content: "";
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background-color: #aaa; /* 初期の背景色 */
		z-index: 0; /* コンテンツよりも背面に配置 */
		animation: none; /* 背景色変化のアニメーション */
		transform-origin: right top;
	}

	#clock {
		position: relative;
		z-index: 1;
		font-size: min(18vw, 40vh, 15rem);
		font-size: min(18vw, 40dvh, 15rem);
		font-family: "Courier New", monospace;
		white-space: nowrap;
		text-shadow: 0 2px 12px #0008;
		font-variant-numeric: tabular-nums;
	}

	@keyframes colorChange {
		0% {
			transform-origin: right top;
			transform: scale(0, 1);
		}
		25% {
			transform-origin: right top;
			transform: scale(0.2, 1);
		}
		50% {
			transform-origin: right top;
			transform: scale(0.5, 1);
			
		}
		75% {
			transform-origin: right top;
			transform: scale(0.8, 1);
		}
		100% {
			transform-origin:right top;
			transform:scale(1, 1);
		}
	}
	
	@keyframes colorChange2 {
		0% {
			transform-origin: left top;
			transform: scale(0, 1);
		}
		25% {
			transform-origin: left top;
			transform: scale(0.2, 1);
		}
		50% {
			transform-origin: left top;
			transform: scale(0.5, 1);
			
		}
		75% {
			transform-origin: left top;
			transform: scale(0.8, 1);
		}
		100% {
			transform-origin:left top;
			transform:scale(1, 1);
		}
	}
	@keyframes colorChange3 {
		0% {
			transform-origin: right top;
			transform: scale(1, 0);
		}
		25% {
			transform-origin: right top;
			transform: scale(1, 0.2);
		}
		50% {
			transform-origin: right top;
			transform: scale(1, 0.5);
		}
		75% {
			transform-origin: right top;
			transform: scale(1, 0.8);
		}
		100% {
			transform-origin:right top;
			transform:scale(1, 1);
		}
	}
	@keyframes colorChange4 {
		0% {
			transform-origin: left bottom;
		   transform: scale(1, 0);
		}
		25% {
			transform-origin: left bottom;
			transform: scale(1, 0.2);
		}
		50% {
			transform-origin: left bottom;
			transform: scale(1, 0.5);
		}
		75% {
			transform-origin: left bottom;
			transform: scale(1, 0.8);
		}
		100% {
			transform-origin:left bottom;
			transform:scale(1, 1);
		}
	}
	@media (prefers-reduced-motion: reduce) {
		#display {
			animation: none !important;
			transform: none !important;
		}
	}
</style>
</head>
<body>
<div id="display" aria-hidden="true"></div>
<time id="clock" aria-label="現在時刻"></time>
<script>
	const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
	const clock = document.getElementById('clock');
	const display = document.getElementById('display');
	const animations = ['colorChange', 'colorChange2', 'colorChange3', 'colorChange4'];
	let previousAnimation = -1;
	let currentColor;
	let timer;

	// Bound relative luminance so white digits stay readable on both layers.
	function randomColor() {
		const rgb = Array.from({ length: 3 }, () => Math.floor(Math.random() * 256));
		const luminance = rgb.reduce((sum, value, i) => {
			const channel = value / 255;
			return sum + [0.2126, 0.7152, 0.0722][i] *
				(channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4);
		}, 0);
		// Scaling encoded RGB by this factor also bounds linear luminance.
		const scale = luminance > 0.18 ? 0.18 / luminance : 1;
		return `rgb(${rgb.map(value => Math.floor(value * scale)).join(', ')})`;
	}

	function updateBackground(animate) {
		if (currentColor) document.body.style.backgroundColor = currentColor;
		currentColor = randomColor();
		display.style.backgroundColor = currentColor;
		if (!animate || reduceMotion.matches) {
			display.style.animation = 'none';
			document.body.style.backgroundColor = currentColor;
			return;
		}
		// Pick a different name so CSS always starts a new animation.
		const choices = animations.map((_, i) => i).filter(i => i !== previousAnimation);
		previousAnimation = choices[Math.floor(Math.random() * choices.length)];
		display.style.animation = `${animations[previousAnimation]} 0.9s linear`;
	}

	function tick(animate = true) {
		clearTimeout(timer);
		const now = new Date();
		const time = [now.getHours(), now.getMinutes(), now.getSeconds()]
			.map(value => String(value).padStart(2, '0')).join(':');
		clock.textContent = time;
		clock.dateTime = time;
		updateBackground(animate);
		if (!document.hidden) timer = setTimeout(tick, 1000 - Date.now() % 1000);
	}

	document.addEventListener('visibilitychange', () => {
		clearTimeout(timer);
		if (!document.hidden) tick(false);
	});
	window.addEventListener('pageshow', () => tick(false));
	reduceMotion.addEventListener('change', () => tick(false));
	tick(false);
</script>
</body>
</html>
