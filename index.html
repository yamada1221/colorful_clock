<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背景色変化時計</title>
<style>
	body {
		margin: 0;
		display: grid;
		grid-template-rows: minmax(0, 1fr);
		place-items: center;
		height: 100vh;
		height: 100dvh;
		color: #fff;
		font-family: Arial, sans-serif;
		position: relative;
		isolation: isolate;
		background-color: #243447;
		overflow: hidden;
	}

	#display {
		content: "";
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background-color: #aaa; /* 初期の背景色 */
		z-index: 0; /* コンテンツよりも背面に配置 */
		animation: none; /* 背景色変化のアニメーション */
		transform-origin: right top;
	}

	#clock {
		position: relative;
		z-index: 1;
		font-size: min(18vw, 40vh, 15rem);
		font-size: min(18vw, 40dvh, 15rem);
		font-family: "Courier New", monospace;
		white-space: nowrap;
		text-shadow: 0 2px 12px #0008;
		font-variant-numeric: tabular-nums;
	}

	@keyframes colorChange {
		0% {
			transform-origin: right top;
			transform: scale(0, 1);
		}
		25% {
			transform-origin: right top;
			transform: scale(0.2, 1);
		}
		50% {
			transform-origin: right top;
			transform: scale(0.5, 1);
			
		}
		75% {
			transform-origin: right top;
			transform: scale(0.8, 1);
		}
		100% {
			transform-origin:right top;
			transform:scale(1, 1);
		}
	}
	
	@keyframes colorChange2 {
		0% {
			transform-origin: left top;
			transform: scale(0, 1);
		}
		25% {
			transform-origin: left top;
			transform: scale(0.2, 1);
		}
		50% {
			transform-origin: left top;
			transform: scale(0.5, 1);
			
		}
		75% {
			transform-origin: left top;
			transform: scale(0.8, 1);
		}
		100% {
			transform-origin:left top;
			transform:scale(1, 1);
		}
	}
	@keyframes colorChange3 {
		0% {
			transform-origin: right top;
			transform: scale(1, 0);
		}
		25% {
			transform-origin: right top;
			transform: scale(1, 0.2);
		}
		50% {
			transform-origin: right top;
			transform: scale(1, 0.5);
		}
		75% {
			transform-origin: right top;
			transform: scale(1, 0.8);
		}
		100% {
			transform-origin:right top;
			transform:scale(1, 1);
		}
	}
	@keyframes colorChange4 {
		0% {
			transform-origin: left bottom;
		   transform: scale(1, 0);
		}
		25% {
			transform-origin: left bottom;
			transform: scale(1, 0.2);
		}
		50% {
			transform-origin: left bottom;
			transform: scale(1, 0.5);
		}
		75% {
			transform-origin: left bottom;
			transform: scale(1, 0.8);
		}
		100% {
			transform-origin:left bottom;
			transform:scale(1, 1);
		}
	}
	@media (prefers-reduced-motion: reduce) {
		#display {
			animation: none !important;
			transform: none !important;
		}
	}

	.music-controls {
		position: absolute; bottom: 0; z-index: 3; box-sizing: border-box;
		width: min(100%, 42rem); padding: 0 16px max(12px, env(safe-area-inset-bottom));
		font-size: 0.875rem; text-align: center;
	}
	.music-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
	button, select { font: inherit; color: #fff; background: #152032; border: 1px solid #ffffff80; border-radius: 8px; min-height: 44px; padding: 6px 12px; }
	button { cursor: pointer; min-width: 7em; }
	input[type="range"] { width: 90px; vertical-align: middle; accent-color: #fff; }
	a { color: #fff; text-underline-offset: 3px; }
	:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
	#music-status { min-height: 1.2em; margin: 8px 0; }
	.credit { font-size: 0.75rem; }
	.icon-button { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; width: 44px; padding: 0; }
	.icon { display: inline-block; width: 20px; height: 20px; position: relative; flex: none; }
	.icon-play { width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 14px solid currentColor; margin-left: 3px; }
	.icon-stop { width: 15px; height: 15px; background: currentColor; }
	#music-toggle .icon-stop, #music-toggle[data-state="playing"] .icon-play { display: none; }
	#music-toggle[data-state="playing"] .icon-stop { display: inline-block; }
	#music-toggle[aria-busy="true"] { opacity: .65; }
	.mode-buttons { display: inline-flex; gap: 4px; }
	.mode-buttons button { min-width: 44px; }
	.mode-buttons button[aria-pressed="true"] { background: #fff; color: #152032; }
	.icon-sun::before { content: ""; position: absolute; inset: 5px; border: 2px solid currentColor; border-radius: 50%; }
	.icon-sun::after { content: ""; position: absolute; width: 2px; height: 3px; top: 0; left: 9px; background: currentColor; box-shadow: 0 17px, 8.5px 8.5px, -8.5px 8.5px, 6px 2.5px, -6px 2.5px, 6px 14.5px, -6px 14.5px; }
	.icon-moon { width: 17px; height: 17px; border-radius: 50%; box-shadow: -5px 3px 0 0 currentColor; transform: translate(3px,-2px); }
	#music-track { max-width: min(100%, 20rem); width: 100%; }
	.track-row { margin-top: 8px; }
	#controls-reveal { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; padding: 0; min-width: 0; border: 0; border-radius: 0; background: transparent; color: inherit; touch-action: manipulation; }
	#controls-reveal:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
	.music-controls[hidden] { display: none; }
	@media (max-height: 320px) { #clock { font-size: min(18vw, 28dvh); } .music-controls { padding-bottom: 4px; } }
</style>
</head>
<body>
<div id="display" aria-hidden="true"></div>
<time id="clock" aria-label="現在時刻"></time>
<button id="controls-reveal" type="button" aria-label="BGMの操作を表示" aria-controls="music-controls" aria-expanded="false"></button>
<section id="music-controls" class="music-controls" aria-label="BGM" hidden>
  <div class="music-row">
    <button id="music-toggle" class="icon-button" type="button" data-state="stopped" aria-label="BGMを再生" title="BGMを再生" aria-pressed="false"><span class="icon icon-play" aria-hidden="true"></span><span class="icon icon-stop" aria-hidden="true"></span></button>
    <div class="mode-buttons" role="group" aria-label="BGMの時間帯">
      <button type="button" data-mode="auto" aria-pressed="true">自動</button>
      <button type="button" class="icon-button" data-mode="day" aria-label="昼の曲" title="昼の曲" aria-pressed="false"><span class="icon icon-sun" aria-hidden="true"></span></button>
      <button type="button" class="icon-button" data-mode="night" aria-label="夜の曲" title="夜の曲" aria-pressed="false"><span class="icon icon-moon" aria-hidden="true"></span></button>
    </div>
    <label>音量 <input id="music-volume" type="range" min="0" max="100" step="0.1" value="25" aria-label="BGMの音量"></label>
  </div>
  <div class="track-row"><select id="music-track" aria-label="曲を選ぶ"></select></div>
  <p id="music-status" role="status">再生ボタンで音楽が流れます</p>
  <div class="credit">音楽：<a href="https://bgmer.net/" target="_blank" rel="noopener noreferrer">BGMer</a> · <a id="music-source" href="https://bgmer.net/music/333/" target="_blank" rel="noopener noreferrer">楽曲ページ</a></div>
</section>
<script>
	const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
	const clock = document.getElementById('clock');
	const display = document.getElementById('display');
	const animations = ['colorChange', 'colorChange2', 'colorChange3', 'colorChange4'];
	let previousAnimation = -1;
	let currentColor;
	let timer;

	// Bound relative luminance so white digits stay readable on both layers.
	function randomColor() {
		const rgb = Array.from({ length: 3 }, () => Math.floor(Math.random() * 256));
		const luminance = rgb.reduce((sum, value, i) => {
			const channel = value / 255;
			return sum + [0.2126, 0.7152, 0.0722][i] *
				(channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4);
		}, 0);
		// Scaling encoded RGB by this factor also bounds linear luminance.
		const scale = luminance > 0.18 ? 0.18 / luminance : 1;
		return `rgb(${rgb.map(value => Math.floor(value * scale)).join(', ')})`;
	}

	function updateBackground(animate) {
		if (currentColor) document.body.style.backgroundColor = currentColor;
		currentColor = randomColor();
		display.style.backgroundColor = currentColor;
		if (!animate || reduceMotion.matches) {
			display.style.animation = 'none';
			document.body.style.backgroundColor = currentColor;
			return;
		}
		// Pick a different name so CSS always starts a new animation.
		const choices = animations.map((_, i) => i).filter(i => i !== previousAnimation);
		previousAnimation = choices[Math.floor(Math.random() * choices.length)];
		display.style.animation = `${animations[previousAnimation]} 0.9s linear`;
	}

	function tick(animate = true) {
		clearTimeout(timer);
		const now = new Date();
		const time = [now.getHours(), now.getMinutes(), now.getSeconds()]
			.map(value => String(value).padStart(2, '0')).join(':');
		clock.textContent = time;
		clock.dateTime = time;
		updateBackground(animate);
		window.dispatchEvent(new Event('clocktick'));
		if (!document.hidden) timer = setTimeout(tick, 1000 - Date.now() % 1000);
	}

	document.addEventListener('visibilitychange', () => {
		clearTimeout(timer);
		if (!document.hidden) tick(false);
	});
	window.addEventListener('pageshow', () => tick(false));
	reduceMotion.addEventListener('change', () => tick(false));
	tick(false);
</script>
<script src="bgm.js?v=20261023-volume"></script>
<script src="controls.js"></script>
</body>
</html>
