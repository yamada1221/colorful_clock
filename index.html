<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背景色変化時計</title>
<style>
	body {
		margin: 0;
		display: grid;
		grid-template-rows: minmax(0, 1fr) auto;
		place-items: center;
		height: 100vh;
		height: 100dvh;
		color: #fff;
		font-family: Arial, sans-serif;
		position: relative;
		isolation: isolate;
		background-color: #243447;
		overflow: hidden;
	}

	#display {
		content: "";
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background-color: #aaa; /* 初期の背景色 */
		z-index: 0; /* コンテンツよりも背面に配置 */
		animation: none; /* 背景色変化のアニメーション */
		transform-origin: right top;
	}

	#clock {
		position: relative;
		z-index: 1;
		font-size: min(18vw, 40vh, 15rem);
		font-size: min(18vw, 40dvh, 15rem);
		font-family: "Courier New", monospace;
		white-space: nowrap;
		text-shadow: 0 2px 12px #0008;
		font-variant-numeric: tabular-nums;
	}

	@keyframes colorChange {
		0% {
			transform-origin: right top;
			transform: scale(0, 1);
		}
		25% {
			transform-origin: right top;
			transform: scale(0.2, 1);
		}
		50% {
			transform-origin: right top;
			transform: scale(0.5, 1);
			
		}
		75% {
			transform-origin: right top;
			transform: scale(0.8, 1);
		}
		100% {
			transform-origin:right top;
			transform:scale(1, 1);
		}
	}
	
	@keyframes colorChange2 {
		0% {
			transform-origin: left top;
			transform: scale(0, 1);
		}
		25% {
			transform-origin: left top;
			transform: scale(0.2, 1);
		}
		50% {
			transform-origin: left top;
			transform: scale(0.5, 1);
			
		}
		75% {
			transform-origin: left top;
			transform: scale(0.8, 1);
		}
		100% {
			transform-origin:left top;
			transform:scale(1, 1);
		}
	}
	@keyframes colorChange3 {
		0% {
			transform-origin: right top;
			transform: scale(1, 0);
		}
		25% {
			transform-origin: right top;
			transform: scale(1, 0.2);
		}
		50% {
			transform-origin: right top;
			transform: scale(1, 0.5);
		}
		75% {
			transform-origin: right top;
			transform: scale(1, 0.8);
		}
		100% {
			transform-origin:right top;
			transform:scale(1, 1);
		}
	}
	@keyframes colorChange4 {
		0% {
			transform-origin: left bottom;
		   transform: scale(1, 0);
		}
		25% {
			transform-origin: left bottom;
			transform: scale(1, 0.2);
		}
		50% {
			transform-origin: left bottom;
			transform: scale(1, 0.5);
		}
		75% {
			transform-origin: left bottom;
			transform: scale(1, 0.8);
		}
		100% {
			transform-origin:left bottom;
			transform:scale(1, 1);
		}
	}
	@media (prefers-reduced-motion: reduce) {
		#display {
			animation: none !important;
			transform: none !important;
		}
	}

	.music-controls {
		position: relative; z-index: 1; box-sizing: border-box;
		width: min(100%, 42rem); padding: 0 16px max(12px, env(safe-area-inset-bottom));
		font-size: 0.875rem; text-align: center;
	}
	.music-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
	button, select { font: inherit; color: #fff; background: #152032; border: 1px solid #ffffff80; border-radius: 8px; min-height: 44px; padding: 6px 12px; }
	button { cursor: pointer; min-width: 7em; }
	input[type="range"] { width: 90px; vertical-align: middle; accent-color: #fff; }
	a { color: #fff; text-underline-offset: 3px; }
	:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
	#music-status { min-height: 1.2em; margin: 8px 0; }
	.credit { font-size: 0.75rem; }
	@media (max-height: 320px) { #clock { font-size: min(18vw, 28dvh); } .music-controls { padding-bottom: 4px; } }
</style>
</head>
<body>
<div id="display" aria-hidden="true"></div>
<time id="clock" aria-label="現在時刻"></time>
<section class="music-controls" aria-label="BGM">
  <div class="music-row">
    <button id="music-toggle" type="button" aria-pressed="false">BGMを再生</button>
    <select id="music-mode" aria-label="BGMの選曲">
      <option value="auto">昼夜で自動</option>
      <option value="day">昼の曲</option>
      <option value="night">夜の曲</option>
    </select>
    <label>音量 <input id="music-volume" type="range" min="0" max="100" value="25" aria-label="BGMの音量"></label>
  </div>
  <p id="music-status" role="status">再生ボタンで音楽が流れます</p>
  <div class="credit">音楽：<a href="https://bgmer.net/" target="_blank" rel="noopener noreferrer">BGMer</a> · <a id="music-source" href="https://bgmer.net/music/333/" target="_blank" rel="noopener noreferrer">楽曲ページ</a></div>
</section>
<script>
	const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
	const clock = document.getElementById('clock');
	const display = document.getElementById('display');
	const animations = ['colorChange', 'colorChange2', 'colorChange3', 'colorChange4'];
	let previousAnimation = -1;
	let currentColor;
	let timer;

	// Bound relative luminance so white digits stay readable on both layers.
	function randomColor() {
		const rgb = Array.from({ length: 3 }, () => Math.floor(Math.random() * 256));
		const luminance = rgb.reduce((sum, value, i) => {
			const channel = value / 255;
			return sum + [0.2126, 0.7152, 0.0722][i] *
				(channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4);
		}, 0);
		// Scaling encoded RGB by this factor also bounds linear luminance.
		const scale = luminance > 0.18 ? 0.18 / luminance : 1;
		return `rgb(${rgb.map(value => Math.floor(value * scale)).join(', ')})`;
	}

	function updateBackground(animate) {
		if (currentColor) document.body.style.backgroundColor = currentColor;
		currentColor = randomColor();
		display.style.backgroundColor = currentColor;
		if (!animate || reduceMotion.matches) {
			display.style.animation = 'none';
			document.body.style.backgroundColor = currentColor;
			return;
		}
		// Pick a different name so CSS always starts a new animation.
		const choices = animations.map((_, i) => i).filter(i => i !== previousAnimation);
		previousAnimation = choices[Math.floor(Math.random() * choices.length)];
		display.style.animation = `${animations[previousAnimation]} 0.9s linear`;
	}

	function tick(animate = true) {
		clearTimeout(timer);
		const now = new Date();
		const time = [now.getHours(), now.getMinutes(), now.getSeconds()]
			.map(value => String(value).padStart(2, '0')).join(':');
		clock.textContent = time;
		clock.dateTime = time;
		updateBackground(animate);
		window.dispatchEvent(new Event('clocktick'));
		if (!document.hidden) timer = setTimeout(tick, 1000 - Date.now() % 1000);
	}

	document.addEventListener('visibilitychange', () => {
		clearTimeout(timer);
		if (!document.hidden) tick(false);
	});
	window.addEventListener('pageshow', () => tick(false));
	reduceMotion.addEventListener('change', () => tick(false));
	tick(false);
</script>
<script src="bgm.js"></script>
</body>
</html>
